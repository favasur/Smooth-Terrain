plugins {
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev'
}
base {
	archivesName = "${mod_id}-neoforge-26.2"
}

neoForge {
	version = rootProject.property('neoforge_version_26_2')

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
			sourceSet project(":forge-26.2").sourceSets.main
		}
	}

	runs {
		client {}
		server {}
		configureEach {
			systemProperty 'mixin.debug.verbose', 'true'
			systemProperty 'mixin.debug.export', 'true'
			jvmArgument '-ea'
		}
	}
}

dependencies {
	testImplementation(compileOnly(project(':forge-26.2')))
	jarJar(implementation(group: 'io.github.llamalad7', name: 'mixinextras-neoforge', version: rootProject.ext.MIXIN_EXTRAS_VERSION))
	jarJar(implementation(group: 'org.beryx', name: 'awt-color-factory', version: rootProject.ext.COLOR_FACTORY_VERSION))
}

tasks.withType(JavaCompile).configureEach {
	source(project(":forge-26.2").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
	source(project(":forge-26.2").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
	from(project(":forge-26.2").sourceSets.main.allSource)
}

processResources {
	from project(":forge-26.2").sourceSets.main.resources
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url "file://" + System.getenv("local_maven")
		}
	}
}
