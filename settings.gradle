pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'NeoForge'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Sponge Snapshots'
			url = 'https://repo.spongepowered.org/repository/maven-public/'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'SmoothTerrain'

// === Minecraft 1.21.x (building) ===
include("forge-1.21")
include("neoforge-1.21")

// === Awaiting dependency resolution ===
include("fabric-1.21")
//include("forge-26.2")
//include("neoforge-26.2")
//include("fabric-26.2")
