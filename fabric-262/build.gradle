plugins {
    // No-remap Loom variant: 26.2 ships the client jar pre-mapped with official
    // Mojang names (no separate mappings artifact exists), so remapping is disabled.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        // Canonical Smooth Terrain mesh/collision core. Loader bootstrap, rendering,
        // networking, and mixin entrypoints stay target-local (compat tree in this module).
        java.srcDir('../src/main/java/io/github/favasur/smoothterrain')
        // 26.2 API-adapted copies of these canonical core files live in the module's compat dir.
        java.exclude 'config/SmoothTerrainConfig.java'
        java.exclude 'util/Area.java'
        java.exclude 'mesh/MeshCache.java'
        java.exclude 'collision/CollisionHandler.java'
        java.exclude 'client/**'
        java.exclude 'hooks/Hooks.java'
        java.exclude 'hooks/ClientHooks.java'
        java.exclude 'network/**'
        java.exclude 'neoforge/**'
        java.exclude 'platform/IClientPlatform.java'
        java.exclude 'platform/IMixinPlatform.java'
        java.exclude 'mixin/**'
        java.exclude 'config/SmoothTerrainConfigImpl.java'
        java.exclude 'platform/IPlatform.java'
        java.exclude 'platform/PlatformLoader.java'
        java.exclude 'hooks/trait/**'
        java.exclude 'smoothable/SmoothableHandler.java'
        java.exclude 'util/BlockStateSerializer.java'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('collectJars') {
    dependsOn tasks.named('jar')
    doLast {
        def output = rootProject.file('dist')
        output.mkdirs()
        copy {
            from tasks.named('jar').get().archiveFile
            into output
            rename { "${mod_id}-fabric-${minecraft_version}-${mod_version}.jar" }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
