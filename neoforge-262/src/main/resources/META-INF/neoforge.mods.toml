modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Smooth Terrain contributors"
description='''
Smooth Terrain (Surface Nets meshing) for NeoForge 26.2: smooths block terrain into organic
slopes, adds custom collisions, per-block smoothability toggles and a terrain smoothness
slider in Video Settings.
'''

[[mixins]]
config="smoothterrain.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
